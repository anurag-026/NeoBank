server:
  port: 8888
spring:
  application:
    name: config-server
  security:
    user:
      name: configadmin
      password: config@123
  cloud:
    config:
      server:
        git:
          uri: https://github.com/anurag-026/neobank-config-repo
          default-label: main
          clone-on-start: true
          timeout: 10
management:
  endpoints:
    jmx:
      exposure:
        include:
          - health
          - info
          - metrics